services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spendwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spendwise}
      POSTGRES_DB: ${POSTGRES_DB:-spendwise}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-spendwise}:${POSTGRES_PASSWORD:-spendwise}@postgres:5432/${POSTGRES_DB:-spendwise}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?copy .env.example to .env and set JWT_SECRET}
      JWT_TTL: ${JWT_TTL:-24h}
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    image: migrate/migrate:v4.17.1
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER:-spendwise}:${POSTGRES_PASSWORD:-spendwise}@postgres:5432/${POSTGRES_DB:-spendwise}?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata: